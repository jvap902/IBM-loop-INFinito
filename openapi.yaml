          type: string
          title: Segment Name
        centroid_distance:
          type: number
          title: Centroid Distance
        silhouette_score_local:
          anyOf:
          - type: number
          - type: 'null'
          title: Silhouette Score Local
      type: object
      required:
      - h3_id
      - lat_centroid
      - lon_centroid
      - segment_id
      - segment_name
      - centroid_distance
      title: Axis3HexagonResult
      description: Single hexagon row in the Axis 3 response.
    Axis3RunRequest:
      properties:
        region_filter:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Region Filter
          description: Optional list of H3 parent cell IDs at resolution 5 or 6 used
            to spatially restrict the analysis. Hexagons outside these parent cells
            are excluded before the pipeline runs.
          examples:
          - - 85283473fffffff
            - 8528347bfffffff
        h3_resolution:
          type: integer
          maximum: 9.0
          minimum: 8.0
          title: H3 Resolution
          description: Target H3 resolution (8 or 9).
          default: 8
        feature_weights:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Feature Weights
          description: Optional override of equal feature weights. Keys must match
            feature names in the Gold Feature Store (e.g. 'd_down', 'vol_reclam').
            Values are multiplied against the standardised feature vector.
          examples:
          - d_down: 1.5
            vol_reclam: 2.0
        n_clusters:
          type: integer
          maximum: 10.0
          minimum: 2.0
          title: N Clusters
          description: Number of K-Means clusters (k). Defaults to 3, EDA-confirmed.
          default: 3
        sweep_if_low_silhouette:
          type: boolean
          title: Sweep If Low Silhouette
          description: If True, sweep k ∈ [3, 6] when silhouette < 0.30 and pick the
            best k.
          default: true
      type: object
      title: Axis3RunRequest
      description: Request body for ``POST /tools/axis3/run``.
    Axis3RunResponse:
      properties:
        run_id:
          type: string
          title: Run Id
        axis:
          type: string
          title: Axis
          default: axis3
        duration_seconds:
          type: number
          title: Duration Seconds
        total_hexagons_segmented:
          type: integer
          title: Total Hexagons Segmented
        n_segments:
          type: integer
          title: N Segments
        silhouette_score_global:
          anyOf:
          - type: number
          - type: 'null'
          title: Silhouette Score Global
        segment_profiles:
          items:
            $ref: '#/components/schemas/Axis3SegmentProfile'
          type: array
          title: Segment Profiles
        results:
          items:
            $ref: '#/components/schemas/Axis3HexagonResult'
          type: array
          title: Results
      type: object
      required:
      - run_id
      - duration_seconds
      - total_hexagons_segmented
      - n_segments
      - silhouette_score_global
      - segment_profiles
      - results
