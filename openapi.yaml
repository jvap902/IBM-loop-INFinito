    Axis3HexagonResult:
      properties:
        h3_id:
          type: string
          title: H3 Id
          description: Uber H3 cell identifier (any resolution).
        lat_centroid:
          type: number
          title: Lat Centroid
        lon_centroid:
          type: number
          title: Lon Centroid
        segment_id:
          type: integer
          title: Segment Id
