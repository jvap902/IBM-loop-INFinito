openapi: 3.1.0
info:
  title: Telecom AI Platform — Tool API
  description: 'Internal REST API that exposes the three ML analytical pipelines (Axis
    1: Maintenance & Criticality, Axis 2: Expansion Opportunities, Axis 3: Promotional
    Targeting) as versioned tools for autonomous invocation by the Operational Agent
    and BI dashboards.


    Authentication: supply a valid ``X-API-Key`` header for all ``/run`` and ``/crossvalidate``
    endpoints. The ``GET /tools`` catalogue endpoint is publicly accessible.'
  license:
    name: Internal — Not for public distribution
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - Meta
      summary: Health check
      description: 'Returns ``{status: ok}`` when the API is running. No authentication
        required.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/tools:
    get:
      tags:
      - Discovery
      summary: Tool Catalogue — list all available analytical tools
      description: Returns a machine-readable catalogue of every tool exposed by this
        API, including endpoint paths, HTTP methods, parameter types, and output schema
        references. This endpoint is the agent's tool registry source and does not
        require authentication.
      operationId: get_tool_catalogue_v1_tools_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCatalogueResponse'
  /v1/tools/axis1/run:
    post:
      tags:
      - Tools
      summary: Axis 1 — Run Maintenance & Criticality pipeline
      description: Loads the Gold Feature Store, executes the IsolationForest + LOF
        anomaly detection ensemble, and returns the top-N critical hexagons with their
        anomaly scores and GeoJSON-compatible coordinates. Requires ``X-API-Key``
        header.
      operationId: run_axis1_v1_tools_axis1_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Axis1RunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Axis1RunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /v1/tools/axis1/crossvalidate:
    post:
      tags:
      - Tools
      summary: Axis 1 — Cross-validate critical hexagons against Cloudflare outages
      description: Runs Axis 1 anomaly detection then calls the Cloudflare Radar ``/annotations/outages``
        endpoint for the supplied date range. Returns an agreement rate and a per-event
        hexagon-overlap summary. Requires ``X-API-Key`` header.
      operationId: crossvalidate_axis1_v1_tools_axis1_crossvalidate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Axis1CrossValidateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Axis1CrossValidateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /v1/tools/axis2/run:
    post:
      tags:
      - Tools
      summary: Axis 2 — Run Expansion Opportunities pipeline
      description: Executes the UMAP + HDBSCAN expansion clustering pipeline and returns
        a cluster summary with centroid coordinates, mean feature values, and a TAM
        estimate per cluster. Requires ``X-API-Key`` header.
      operationId: run_axis2_v1_tools_axis2_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Axis2RunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Axis2RunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /v1/tools/axis3/run:
    post:
      tags:
      - Tools
      summary: Axis 3 — Run Promotional Targeting segmentation
      description: Executes the K-Means++ promotional segmentation pipeline and returns
        the full hexagon-level segment assignment table together with segment profile
        metadata. Requires ``X-API-Key`` header.
      operationId: run_axis3_v1_tools_axis3_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Axis3RunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Axis3RunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /v1/audit/events:
    get:
      tags:
      - Audit
      summary: Audit Log — Query recorded events
      description: "Returns a filtered, newest-first list of audit events from the\
        \ Transparency & Auditability Layer.  Supports filtering by agent, event type,\
        \ run ID and date range.  Requires ``X-API-Key`` header. \n\n**Note:** When\
        \ the ``postgres`` backend is active this endpoint performs a direct SQL query.\
        \  For the ``jsonl`` backend it performs a linear scan of the local log file\
        \ — suitable for development and low-volume audit use."
      operationId: get_audit_events_v1_audit_events_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: agent_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by agent identifier ('planner', 'operational', 'system').
          title: Agent Id
        description: Filter by agent identifier ('planner', 'operational', 'system').
      - name: event_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by event type: ''tool_call'', ''reasoning_step'', ''report_generated'',
            or ''model_run''.'
          title: Event Type
        description: 'Filter by event type: ''tool_call'', ''reasoning_step'', ''report_generated'',
          or ''model_run''.'
      - name: run_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by pipeline run UUID to trace a specific execution.
          title: Run Id
        description: Filter by pipeline run UUID to trace a specific execution.
      - name: date_start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Return events at or after this ISO-8601 UTC datetime.
          title: Date Start
        description: Return events at or after this ISO-8601 UTC datetime.
      - name: date_end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Return events at or before this ISO-8601 UTC datetime.
          title: Date End
        description: Return events at or before this ISO-8601 UTC datetime.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Maximum number of events to return (newest first). Max 1000.
          default: 100
          title: Limit
        description: Maximum number of events to return (newest first). Max 1000.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditQueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agent/run:
    post:
      tags:
      - Agent
      summary: Run the full Operational Agent
      description: 'Triggers the complete LangGraph Operational Agent pipeline — gap
        detection, tool selection, axis execution (Axis 1/2/3), result interpretation,
        and report generation — and returns the structured JSON report.


        The call is **synchronous**: it blocks until the agent finishes or until ``AGENT_RUN_TIMEOUT_SECONDS``
        (default 120 s) elapses, at which point HTTP 504 is returned.


        Requires ``X-API-Key`` header.'
      operationId: run_agent_v1_agent_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunRequest'
        required: true
      responses:
        '200':
          description: Agent completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunResponse'
        '504':
          description: Agent did not complete within the configured timeout.
        '500':
          description: Agent execution failed with an unrecoverable error.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
components:
  schemas:
    AgentRunRequest:
      properties:
        region:
          type: string
          title: Region
          description: Region label (e.g. 'BR-SP') or H3 parent cell ID at resolution
            5/6. Use 'all' to analyse the full Gold Feature Store.
          default: all
          examples:
          - BR-SP
          - all
          - 855198c7fffffff
        axes:
          items:
            type: string
          type: array
          title: Axes
          description: 'List of axes to execute. Valid values: axis1, axis2, axis3.'
          default:
          - axis1
          - axis2
          - axis3
          examples:
          - - axis1
            - axis2
            - axis3
        force:
          type: boolean
          title: Force
          description: When True, skips freshness checks and re-runs all selected
            axes.
          default: false
        llm_provider:
          type: string
          title: Llm Provider
          description: 'LLM provider to use: ''stub'' (no credentials), ''watsonx'',
            or ''openai''.'
          default: stub
          examples:
          - stub
          - watsonx
          - openai
      type: object
      title: AgentRunRequest
      description: 'Request body for ``POST /v1/agent/run``.


        Triggers the full LangGraph operational agent and returns the complete

        report JSON without requiring CLI access.'
    AgentRunResponse:
      properties:
        run_id:
          type: string
          title: Run Id
          description: UUID assigned to this agent execution.
        region_scope:
          type: string
          title: Region Scope
          description: Region label or H3 parent ID that was analysed.
        axes_executed:
          items:
            type: string
          type: array
          title: Axes Executed
          description: Axes that were actually executed.
        duration_seconds:
          type: number
          title: Duration Seconds
          description: Wall-clock time for the full agent run.
        summary:
          $ref: '#/components/schemas/AgentRunSummary'
        investment_hypotheses:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Investment Hypotheses
          description: Structured investment hypotheses with TAM, priority class,
            and rationale.
        axis1_summary:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Axis1 Summary
          description: Condensed Axis 1 output (n_critical, anomaly_rate, top critical
            hexagons).
        axis2_summary:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Axis2 Summary
          description: Condensed Axis 2 output (n_clusters, noise_rate, cluster list).
        axis3_summary:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Axis3 Summary
          description: Condensed Axis 3 output (n_segments, silhouette, segment profiles).
        errors:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Errors
          description: Accumulated execution errors, if any.
      type: object
      required:
      - run_id
      - region_scope
      - axes_executed
      - duration_seconds
      - summary
      title: AgentRunResponse
      description: Response body for ``POST /v1/agent/run``.
    AgentRunSummary:
      properties:
        n_critical_hexagons:
          type: integer
          title: N Critical Hexagons
          default: 0
        n_expansion_clusters:
          type: integer
          title: N Expansion Clusters
          default: 0
        n_market_segments:
          type: integer
          title: N Market Segments
          default: 0
        n_investment_hypotheses:
          type: integer
          title: N Investment Hypotheses
          default: 0
        total_tam_brl:
          type: number
          title: Total Tam Brl
          default: 0.0
        capex_proxy_brl:
          type: number
          title: Capex Proxy Brl
          default: 0.0
        p1_clusters:
          type: integer
          title: P1 Clusters
          default: 0
        p2_clusters:
          type: integer
          title: P2 Clusters
          default: 0
      type: object
      title: AgentRunSummary
      description: High-level summary metrics from the agent run.
    AuditEvent:
      properties:
        event_id:
          type: string
          title: Event Id
          description: Unique UUID v4 identifier for this event.
        timestamp:
          type: string
          title: Timestamp
          description: ISO-8601 UTC timestamp of the event.
        agent_id:
          type: string
          enum:
          - planner
          - operational
          - system
          title: Agent Id
          description: Identifier of the agent that triggered this event.
          default: system
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
          description: Pipeline run UUID (links related events in one execution).
        model_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Version
          description: Semantic version string of the ML model artefact used.
        event_type:
          type: string
          enum:
          - tool_call
          - reasoning_step
          - report_generated
          - model_run
          title: Event Type
          description: Classification of the event kind.
        tool_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool Name
          description: Name of the tool endpoint called (e.g. 'axis1_run').
        tool_input:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Tool Input
          description: Sanitised request parameters. PII fields are removed before
            logging. Spatial IDs (h3_id) are safe to record.
        tool_output_summary:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Tool Output Summary
          description: High-level summary of the tool response (e.g. n_critical, n_clusters,
            duration_seconds). Full result payloads are NOT stored to avoid PII leakage.
        reasoning_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Reasoning Text
          description: Free-text Chain-of-Thought reasoning step. Must not contain
            subscriber-level PII.
        explanation:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Explanation
          description: 'SHAP or proxy explanation payload attached to this event.
            Shape depends on the axis: top-N feature importances for Axis 1/3, cluster
            Z-score summary for Axis 2.'
      type: object
      required:
      - event_type
      title: AuditEvent
      description: 'Single auditable event in the Telecom AI Platform.


        All fields except ``event_id`` and ``timestamp`` are optional so that

        partial events (e.g. a reasoning step with no tool invocation) can be

        recorded without forcing callers to construct dummy data.'
    AuditQueryResponse:
      properties:
        total_returned:
          type: integer
          title: Total Returned
        events:
          items:
            $ref: '#/components/schemas/AuditEvent'
          type: array
          title: Events
      type: object
      required:
      - total_returned
      - events
      title: AuditQueryResponse
      description: Response body for ``GET /audit/events``.
    Axis1CrossValidateRequest:
      properties:
        date_start:
          type: string
          title: Date Start
          description: ISO-8601 start date (inclusive), e.g. '2024-01-01'.
        date_end:
          type: string
          title: Date End
          description: ISO-8601 end date (inclusive), e.g. '2024-01-31'.
        region_filter:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Region Filter
          description: Optional list of H3 parent cell IDs at resolution 5 or 6 used
            to spatially restrict the analysis. Hexagons outside these parent cells
            are excluded before the pipeline runs.
          examples:
          - - 85283473fffffff
            - 8528347bfffffff
        anomaly_threshold:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Anomaly Threshold
          default: 0.65
        top_n:
          type: integer
          maximum: 5000.0
          minimum: 1.0
          title: Top N
          default: 50
      type: object
      required:
      - date_start
      - date_end
      title: Axis1CrossValidateRequest
      description: Request body for ``POST /tools/axis1/crossvalidate``.
    Axis1CrossValidateResponse:
      properties:
        run_id:
          type: string
          title: Run Id
        axis:
          type: string
          title: Axis
          default: axis1_crossvalidate
        duration_seconds:
          type: number
          title: Duration Seconds
        date_range:
          additionalProperties:
            type: string
          type: object
          title: Date Range
        n_critical_hexagons:
          type: integer
          title: N Critical Hexagons
        n_cloudflare_outages_fetched:
          type: integer
          title: N Cloudflare Outages Fetched
        agreement_rate:
          type: number
          title: Agreement Rate
          description: Fraction of Cloudflare outage cells also flagged as critical.
        overlapping_events:
          items:
            $ref: '#/components/schemas/OutageOverlapEntry'
          type: array
          title: Overlapping Events
      type: object
      required:
      - run_id
      - duration_seconds
      - date_range
      - n_critical_hexagons
      - n_cloudflare_outages_fetched
      - agreement_rate
      - overlapping_events
      title: Axis1CrossValidateResponse
      description: Response body for ``POST /tools/axis1/crossvalidate``.
    Axis1HexagonResult:
      properties:
        h3_id:
          type: string
          title: H3 Id
          description: Uber H3 cell identifier (any resolution).
        lat_centroid:
          type: number
          title: Lat Centroid
          description: Latitude of the H3 cell centroid.
        lon_centroid:
          type: number
          title: Lon Centroid
          description: Longitude of the H3 cell centroid.
        anomaly_score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Anomaly Score
          description: Normalised anomaly score [0, 1]. Higher = more anomalous.
        is_critical:
          type: integer
          maximum: 1.0
          minimum: 0.0
          title: Is Critical
          description: 1 if the hexagon is flagged as critical, 0 otherwise.
        lof_score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Lof Score
          description: Normalised Local Outlier Factor score [0, 1].
        cloudflare_outage_overlap:
          type: integer
          maximum: 1.0
          minimum: 0.0
          title: Cloudflare Outage Overlap
          description: 1 if this hexagon overlaps a known Cloudflare outage event.
      type: object
      required:
      - h3_id
      - lat_centroid
      - lon_centroid
      - anomaly_score
      - is_critical
      - lof_score
      - cloudflare_outage_overlap
      title: Axis1HexagonResult
      description: Single hexagon row in the Axis 1 response.
    Axis1RunRequest:
      properties:
        region_filter:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Region Filter
          description: Optional list of H3 parent cell IDs at resolution 5 or 6 used
            to spatially restrict the analysis. Hexagons outside these parent cells
            are excluded before the pipeline runs.
          examples:
          - - 85283473fffffff
            - 8528347bfffffff
        h3_resolution:
          type: integer
          maximum: 9.0
          minimum: 8.0
          title: H3 Resolution
          description: Target H3 resolution (8 or 9).
          default: 8
        feature_weights:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Feature Weights
          description: Optional override of equal feature weights. Keys must match
            feature names in the Gold Feature Store (e.g. 'd_down', 'vol_reclam').
            Values are multiplied against the standardised feature vector.
          examples:
          - d_down: 1.5
            vol_reclam: 2.0
        anomaly_threshold:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Anomaly Threshold
          description: IsolationForest normalised score threshold above which a hexagon
            is flagged as critical. Defaults to 0.65 (EDA-confirmed).
          default: 0.65
        top_n:
          type: integer
          maximum: 5000.0
          minimum: 1.0
          title: Top N
          description: Maximum number of anomalous hexagons to return.
          default: 50
        contamination:
          type: number
          maximum: 0.5
          minimum: 0.01
          title: Contamination
          description: IsolationForest contamination fraction (expected anomaly rate).
          default: 0.05
      type: object
      title: Axis1RunRequest
      description: Request body for ``POST /tools/axis1/run``.
    Axis1RunResponse:
      properties:
        run_id:
          type: string
          title: Run Id
          description: Unique identifier for this pipeline run.
        axis:
          type: string
          title: Axis
          description: Axis identifier.
          default: axis1
        duration_seconds:
          type: number
          title: Duration Seconds
          description: Wall-clock execution time in seconds.
        total_hexagons_scored:
          type: integer
          title: Total Hexagons Scored
          description: Total number of hexagons processed.
        n_critical:
          type: integer
          title: N Critical
          description: Number of hexagons flagged as critical.
        anomaly_rate:
          type: number
          title: Anomaly Rate
          description: Fraction of hexagons that are critical.
        results:
          items:
            $ref: '#/components/schemas/Axis1HexagonResult'
          type: array
          title: Results
      type: object
      required:
      - run_id
      - duration_seconds
      - total_hexagons_scored
      - n_critical
      - anomaly_rate
      - results
      title: Axis1RunResponse
      description: Response body for ``POST /tools/axis1/run``.
    Axis2ClusterSummary:
      properties:
        cluster_id:
          type: integer
          title: Cluster Id
          description: HDBSCAN cluster label (-1 for noise).
        cluster_size:
          type: integer
          title: Cluster Size
          description: Number of hexagons in the cluster.
        lat_centroid:
          type: number
          title: Lat Centroid
          description: Mean latitude of hexagons in this cluster.
        lon_centroid:
          type: number
          title: Lon Centroid
          description: Mean longitude of hexagons in this cluster.
        avg_d_down:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg D Down
          description: Mean download speed (Mbps) in the cluster.
        avg_n_dom:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg N Dom
          description: Mean number of residential addresses in the cluster.
        avg_HHI:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Hhi
          description: Mean Herfindahl–Hirschman Index (market concentration) in the
            cluster.
        tam_estimate:
          anyOf:
          - type: number
          - type: 'null'
          title: Tam Estimate
          description: Estimated Total Addressable Market proxy (avg_n_dom × cluster_size).
        is_noise:
          type: integer
          maximum: 1.0
          minimum: 0.0
          title: Is Noise
          description: 1 if this is the noise cluster (-1 label).
          default: 0
      type: object
      required:
      - cluster_id
      - cluster_size
      - lat_centroid
      - lon_centroid
      title: Axis2ClusterSummary
      description: Summary row for a single expansion cluster.
    Axis2RunRequest:
      properties:
        region_filter:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Region Filter
          description: Optional list of H3 parent cell IDs at resolution 5 or 6 used
            to spatially restrict the analysis. Hexagons outside these parent cells
            are excluded before the pipeline runs.
          examples:
          - - 85283473fffffff
            - 8528347bfffffff
        h3_resolution:
          type: integer
          maximum: 9.0
          minimum: 8.0
          title: H3 Resolution
          description: Target H3 resolution (8 or 9).
          default: 8
        feature_weights:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Feature Weights
          description: Optional override of equal feature weights. Keys must match
            feature names in the Gold Feature Store (e.g. 'd_down', 'vol_reclam').
            Values are multiplied against the standardised feature vector.
          examples:
          - d_down: 1.5
            vol_reclam: 2.0
        min_cluster_size:
          type: integer
          maximum: 2000.0
          minimum: 2.0
          title: Min Cluster Size
          description: HDBSCAN minimum cluster size parameter.
          default: 50
        skip_umap:
          type: boolean
          title: Skip Umap
          description: If True, skip UMAP pre-reduction and feed scaled features directly
            into HDBSCAN.
          default: false
      type: object
      title: Axis2RunRequest
